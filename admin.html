<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sipology | Owner dashboard</title><link rel="stylesheet" href="admin.css"></head>
<body><main class="admin-shell"><header><a href="/" class="back">← View website</a><h1>Sipology <span>Owner dashboard</span></h1><p>Manage the menu shown on your public website.</p></header>
<section id="login-panel" class="panel"><h2>Owner sign in</h2><form id="login-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><p id="login-message" role="status"></p></form></section>
<section id="dashboard" hidden><form id="profile-form" class="panel"><h2>Cafe profile</h2><div class="form-grid"><label>Cafe name<input id="cafe-name" maxlength="80" required></label><label>Public identifier / slug<input id="cafe-slug" maxlength="80" required pattern="[a-z0-9-]+" title="Lowercase letters, numbers and hyphens only"></label></div><button type="submit">Save profile</button><p id="profile-message" role="status"></p></form><div class="toolbar"><h2>Menu items</h2><button id="signout" class="secondary">Sign out</button></div><form id="item-form" class="panel"><input type="hidden" id="item-id"><h3 id="form-title">Add a menu item</h3><div class="form-grid"><label>Item name<input id="item-name" maxlength="100" required></label><label>Category<select id="item-category"><option value="coffee">Coffee</option><option value="drinks">Other drinks</option><option value="bakery">Bakery</option><option value="plates">Little plates</option></select></label><label>Price (₹)<input id="item-price" type="number" min="0" max="100000" step="1" required></label><label>Tag<input id="item-tag" maxlength="40" placeholder="Optional"></label><label class="wide">Description<textarea id="item-description" maxlength="300" rows="2"></textarea></label><label class="wide">Image URL<input id="item-image" type="url" placeholder="https://..."></label><label class="check"><input id="item-active" type="checkbox" checked> Available on public menu</label></div><div class="buttons"><button type="submit">Save item</button><button type="button" id="cancel-edit" class="secondary">Clear</button></div><p id="save-message" role="status"></p></form><div id="items-list" class="items-list"></div></section>
</main><script type="module" src="src/admin.js"></script></body></html>
